[package]
name = "tessellio-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Benchmarks: Tessellio screen codec over different transports."
license = "PolyForm-Noncommercial-1.0.0"
documentation = "https://github.com/tessellio/tessellio-bench"
publish = false
keywords = ["benchmark", "codec", "transport"]
categories = ["development-tools"]

[dependencies]
tessellio-core = { git = "https://github.com/tessellio/tessellio-core", rev = "ea2a603"    }
mlp-core = { git = "https://github.com/medialaneprotocol/mlp-core", rev = "c91d74a00eb915153e74c3a1b0f5669cfe5e8877" }
rand = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"

[lints.rust]
unsafe_code = "forbid"
