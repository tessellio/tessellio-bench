[package]
name = "tessellio-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Benchmarks: Tessellio screen codec over different transports."
license = "PolyForm-Noncommercial-1.0.0"
documentation = "https://github.com/tessellio/tessellio-bench"
publish = false
keywords = ["benchmark", "codec", "transport"]
categories = ["development-tools"]

[dependencies]
tessellio-core = { git = "https://github.com/tessellio/tessellio-core", rev = "6c896065af68e9250bef6390b2b52d15dbb1b435" }
mlp-core = { git = "https://github.com/medialaneprotocol/mlp-core", rev = "074cfed234d6b97a75ef91ff0e34f8623afbdcb8" }
rand = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"

[lints.rust]
unsafe_code = "forbid"
