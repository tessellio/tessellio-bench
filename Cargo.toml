[package]
name = "tessellio-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Benchmarks: Tessellio screen codec over different transports."
license = "PolyForm-Noncommercial-1.0.0"
documentation = "https://github.com/tessellio/tessellio-bench"
publish = false
keywords = ["benchmark", "codec", "transport"]
categories = ["development-tools"]

[dependencies]
tessellio-core = { git = "https://github.com/tessellio/tessellio-core", rev = "decd48f281c4a7b3eba59fc62bf21b3f3c1bdbc7" }
mlp-core = { git = "https://github.com/medialaneprotocol/mlp-core", rev = "3a074d2aba326c28158586bac6c4af2e6af111fd" }
rand = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"

[lints.rust]
unsafe_code = "forbid"
